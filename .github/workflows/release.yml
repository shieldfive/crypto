name: release

# Publishes @shieldfive/crypto to npm WITH provenance when a version tag (vX.Y.Z)
# is pushed. npm provenance (https://docs.npmjs.com/generating-provenance-statements)
# cryptographically links the published tarball to this exact source commit and CI
# run, and shows a "verified" provenance badge on the npm package page — a real
# supply-chain trust signal for a cryptography library.
#
# ── ONE-TIME SETUP (required before this works) ──────────────────────────────
#   1. Create an npm token with publish access to @shieldfive/crypto:
#        npmjs.com → Access Tokens → Generate New Token →
#        "Automation" (automation tokens bypass 2FA, which CI needs), or a
#        Granular token scoped to @shieldfive with read+write on the package.
#   2. Add it as a repo secret named NPM_TOKEN:
#        gh secret set NPM_TOKEN --repo shieldfive/crypto
#
# ── RELEASE FLOW (same convention, minus the manual `npm publish`) ────────────
#   merge the release PR → push an annotated tag vX.Y.Z at the merge commit →
#   this workflow type-checks, builds, tests, and publishes with provenance.
#
#   dist-tag is derived from the version:
#     1.0.0          → latest
#     1.0.0-beta.1   → beta      (prereleases go to their own channel, NOT latest)
#     1.0.0-rc.1     → rc
#   To promote a prerelease to `latest`, run manually afterward:
#     npm dist-tag add @shieldfive/crypto@<version> latest

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      ref:
        description: 'Tag to publish (e.g. v1.0.0-rc.1)'
        required: true

permissions:
  contents: read
  id-token: write # REQUIRED for npm provenance (OIDC)

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: 'https://registry.npmjs.org'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Resolve version and verify it matches the tag
        id: ver
        run: |
          PKG_VERSION="$(node -p "require('./package.json').version")"
          TAG_REF="${{ github.event.inputs.ref || github.ref_name }}"
          TAG_VERSION="${TAG_REF#v}"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::Tag $TAG_REF (=$TAG_VERSION) does not match package.json version $PKG_VERSION"
            exit 1
          fi
          echo "version=$PKG_VERSION" >> "$GITHUB_OUTPUT"

      - name: Skip if this version is already on npm
        id: check
        run: |
          if npm view "@shieldfive/crypto@${{ steps.ver.outputs.version }}" version >/dev/null 2>&1; then
            echo "already=true" >> "$GITHUB_OUTPUT"
            echo "::notice::@shieldfive/crypto@${{ steps.ver.outputs.version }} is already published — skipping publish."
          else
            echo "already=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to npm with provenance
        if: steps.check.outputs.already == 'false'
        run: |
          VER="${{ steps.ver.outputs.version }}"
          if [[ "$VER" == *-* ]]; then
            CHANNEL="$(echo "$VER" | sed -E 's/.*-([a-zA-Z]+).*/\1/')"
          else
            CHANNEL="latest"
          fi
          echo "Publishing $VER with provenance to dist-tag: $CHANNEL"
          npm publish --provenance --access public --tag "$CHANNEL"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
