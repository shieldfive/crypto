name: dist-tag

# Manually move an npm dist-tag for @shieldfive/crypto WITHOUT an OTP — uses the
# NPM_TOKEN automation secret (same one release.yml publishes with; automation
# tokens bypass 2FA). Prereleases publish to their own channel (e.g. `beta`) and
# never move `latest` automatically, so this is the sanctioned way to promote a
# published version to another tag, e.g. point `latest` at the newest beta:
#
#   Actions → dist-tag → Run workflow → version=1.0.0-beta.4  tag=latest
#
# `npm dist-tag add` fails if the version is not published, so this cannot point
# a tag at a non-existent version.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Published version to tag (e.g. 1.0.0-beta.4)'
        required: true
      tag:
        description: 'dist-tag to point at that version (e.g. latest, beta)'
        required: true

jobs:
  move-tag:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: 'https://registry.npmjs.org'

      - name: Move dist-tag
        # Inputs passed via env (not interpolated into the shell) to avoid
        # script injection.
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          VERSION: ${{ inputs.version }}
          TAG: ${{ inputs.tag }}
        run: |
          npm dist-tag add "@shieldfive/crypto@${VERSION}" "${TAG}"
          echo "--- dist-tags now ---"
          npm dist-tag ls @shieldfive/crypto
